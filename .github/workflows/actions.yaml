name: Github CI
on:
  # Confirgura servidor de CI para executar o pipeline de tarefas abaixo (jobs) quando
  # um push ou pull request for realizado tendo como alvo a branch main

  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest # Os comandos serao executados em um sistema operacional Linux

    steps:
      - name: Git Checkout
        uses:
          actions/checkout@v2 # Faz o checkout do codigo recebido

      - name: Set up JDK 1.8
        uses: actions/setup-java@v1 # Configura o java 1.8
        with:
          java-version: 1.8

      - name: Build
        run: mvn package -Dmaven.test.skip=true # Compila o codigo fonte

      - name: Unit Test
        run: mvn test # Executa os testes de unidade

